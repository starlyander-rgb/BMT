<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 420" width="1600" height="420" role="img" aria-label="Banner BMT Camino de Formación - resumen del contenido de la página">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFDF8"/>
      <stop offset="60%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFF6D8"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#DA291C"/>
      <stop offset="50%" stop-color="#FFC72C"/>
      <stop offset="100%" stop-color="#27251F"/>
    </linearGradient>
    <style>
      .base { font-family: Inter, Arial, Helvetica, sans-serif; }
      .ink { fill: #27251F; }
      .muted { fill: #5F6360; }
      .red { fill: #DA291C; }
    </style>
  </defs>

  <rect width="1600" height="420" fill="url(#bg)"/>
  <rect width="1600" height="6" fill="url(#bar)"/>

  <!-- subtle background shapes -->
  <circle cx="1435" cy="70" r="190" fill="#FFC72C" opacity="0.10"/>
  <circle cx="1310" cy="360" r="150" fill="#DA291C" opacity="0.06"/>

  <!-- Left: banner identity -->
  <g class="base">
    <text x="72" y="112" font-size="68" font-weight="800" letter-spacing="-2" class="ink">Camino de Formación</text>
    <text x="72" y="156" font-size="26" font-weight="500" class="muted">Guía de entrenamiento.</text>

    <rect x="72" y="194" width="520" height="1" fill="#E7E9EA"/>
    <text x="72" y="230" font-size="16" font-weight="700" letter-spacing="1.5" fill="#8A8F8C">EN ESTA PÁGINA ENCONTRARÁS</text>

    <!-- Content map: compact index, not cards -->
    <g font-size="18" font-weight="600" class="ink">
      <circle cx="82" cy="266" r="5" fill="#DA291C"/>
      <text x="98" y="272">Cooltura: Propósito, Principios e Identidad</text>

      <circle cx="82" cy="302" r="5" fill="#FFC72C"/>
      <text x="98" y="308">Influencers vendedores · 6 herramientas</text>

      <circle cx="82" cy="338" r="5" fill="#27251F"/>
      <text x="98" y="344">Hospitalidad: 5 estándares y Promesa de entrenamiento</text>
    </g>

    <g font-size="18" font-weight="600" class="ink">
      <circle cx="640" cy="266" r="5" fill="#DA291C"/>
      <text x="656" y="272">Camino de Formación Crew</text>

      <circle cx="640" cy="302" r="5" fill="#FFC72C"/>
      <text x="656" y="308">Camino de Formación LEC y Rol del LEC</text>

      <circle cx="640" cy="338" r="5" fill="#27251F"/>
      <text x="656" y="344">12 estaciones: Producción y Servicio</text>
    </g>
  </g>

  <!-- Right: simple visual summary, banner-like -->
  <g class="base">
    <rect x="1085" y="58" width="443" height="304" rx="24" fill="#FFFFFF" stroke="#E7E9EA"/>
    <text x="1117" y="98" font-size="15" font-weight="700" letter-spacing="1.4" fill="#8A8F8C">RESUMEN DEL CONTENIDO</text>

    <!-- Mini flow -->
    <rect x="1117" y="132" width="379" height="52" rx="12" fill="#FFF1EF" stroke="#F0BAB4"/>
    <text x="1137" y="164" font-size="20" font-weight="700" class="ink">1. Programas</text>
    <text x="1280" y="164" font-size="15" font-weight="500" class="muted">Crew · LEC · Rol del LEC</text>

    <rect x="1117" y="200" width="379" height="52" rx="12" fill="#F6F7F8" stroke="#E7E9EA"/>
    <text x="1137" y="232" font-size="20" font-weight="700" class="ink">2. Estaciones</text>
    <text x="1285" y="232" font-size="15" font-weight="500" class="muted">5 Producción · 7 Servicio</text>
  </g>
</svg>
